[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zippy-workers"
version = "0.0.1"
description = "Zippy Logistics Python agent workers"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncpg]>=2.0.36",
    "redis>=5.2.0",
    "rq>=1.16.0",
    "supabase>=2.10.0",
    "langfuse>=2.55.0",
    "sentry-sdk>=2.19.0",
    "structlog>=24.4.0",
    "typer>=0.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "mkinit>=1.0.0",
]

[project.scripts]
zippy-workers = "zippy_workers.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/zippy_workers"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

name: Disposable database proofs (manual only)

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full reviewed main SHA; must match this workflow and green post-merge CI
        required: true
        type: string
      authorization_expires_utc:
        description: Explicit one-run approval expiry, UTC ISO-8601, no more than one hour ahead
        required: true
        type: string
      authorize_one_proof:
        description: Owner authorizes one synthetic disposable operations and governance proof
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: disposable-postgres-proof
  cancel-in-progress: false

jobs:
  database-proof:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'Gopi-git-bit/New-logistic-' &&
      github.ref == 'refs/heads/main' &&
      github.actor_id == '200721521' &&
      github.actor == 'Gopi-git-bit' &&
      github.triggering_actor == 'Gopi-git-bit' &&
      github.run_attempt == 1 &&
      github.sha == inputs.source_sha &&
      github.workflow_sha == github.sha &&
      inputs.authorize_one_proof == true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact source without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify current main, run admission and all five post-merge checks
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PROOF_SOURCE: ${{ inputs.source_sha }}
          PROOF_EXPIRES: ${{ inputs.authorization_expires_utc }}
        run: |
          set +x
          set -euo pipefail
          python3 -I db/scripts/admit_disposable_ci.py \
            --source "$PROOF_SOURCE" --expires "$PROOF_EXPIRES" \
            --output "$RUNNER_TEMP/disposable-admission.json"
      - name: Run bounded proof with generated synthetic credentials only
        id: proof
        shell: bash
        run: |
          set +x
          set -euo pipefail
          sudo env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            GITHUB_ACTIONS=true PYTHONDONTWRITEBYTECODE=1 \
            python3 -I db/scripts/run_disposable_ci.py \
              --repo "$GITHUB_WORKSPACE" \
              --admission "$RUNNER_TEMP/disposable-admission.json" \
              --report "$RUNNER_TEMP/disposable-summary.json"
      - name: Retain only sanitized proof summary
        id: evidence
        if: ${{ always() && steps.proof.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: disposable-postgres-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/disposable-summary.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
          include-hidden-files: false
      - name: Record immutable artifact identity
        if: ${{ always() && steps.evidence.outcome == 'success' }}
        shell: bash
        env:
          PROOF_ARTIFACT_ID: ${{ steps.evidence.outputs.artifact-id }}
          PROOF_ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          [[ "$PROOF_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$PROOF_ARTIFACT_DIGEST" =~ ^[a-f0-9]{64}$ ]]
          printf 'artifact_id=%s artifact_sha256=%s\n' "$PROOF_ARTIFACT_ID" "$PROOF_ARTIFACT_DIGEST" >> "$GITHUB_STEP_SUMMARY"

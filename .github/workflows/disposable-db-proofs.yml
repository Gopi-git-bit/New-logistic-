name: Disposable database proofs

on:
  pull_request:
    branches: [master, main]
    paths:
      - 'api/**'
      - 'db/**'
      - 'requirements-api*.txt'
      - '.github/workflows/disposable-db-proofs.yml'
      - 'docs/plans/DISPOSABLE_DATABASE_PROOFS.md'

permissions:
  contents: read

jobs:
  database-proof:
    name: PostgreSQL proof (${{ matrix.proof }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        proof: [operations, governance]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-api-dev.txt
      - name: Check proof-report gate regressions
        run: .venv/bin/python -m pytest db/tests/test_proof_report.py -q
      - name: Obtain the existing pinned PostgreSQL artifact
        run: |
          docker pull postgres@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
          docker image inspect postgres@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94 \
            --format 'config_id={{.Id}} repo_digests={{json .RepoDigests}}'
      - name: Run fresh disposable proof
        env:
          PROOF_KIND: ${{ matrix.proof }}
        run: |
          sudo env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin GITHUB_ACTIONS=true \
            bash db/scripts/run_ci_proof.sh "$PROOF_KIND"

name: M7 synthetic policy check

on:
  pull_request:
    paths:
      - infra/m7-staging/synthetic-*.nft.json
      - workers/scripts/oms_synthetic_contract.py
      - workers/tests/test_synthetic_evidence_package.py
      - workers/tests/fixtures/nft-1.0.9-*.json
      - .github/workflows/m7-synthetic-policy-check.yml
  push:
    branches: [main]
    paths:
      - infra/m7-staging/synthetic-*.nft.json
      - workers/scripts/oms_synthetic_contract.py
      - workers/tests/test_synthetic_evidence_package.py
      - workers/tests/fixtures/nft-1.0.9-*.json
      - .github/workflows/m7-synthetic-policy-check.yml

permissions:
  contents: read

jobs:
  nft-round-trip:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install policy parser on disposable CI runner only
        run: |
          if ! command -v nft >/dev/null || ! command -v ip >/dev/null; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y nftables iproute2
          fi
      - name: Kernel check and export comparison in disposable isolated namespace
        shell: bash
        run: |
          set -euo pipefail
          namespace="zippy-m7-policy-ci-${GITHUB_RUN_ID}"
          sudo ip netns add "$namespace"
          trap 'sudo ip netns del "$namespace"' EXIT
          nft --version
          for phase in calibration restricted peer; do
            sudo ip netns exec "$namespace" nft --check --json --file "infra/m7-staging/synthetic-${phase}.nft.json"
          done
          sudo ip netns exec "$namespace" nft --json list ruleset | python3 -c 'import json,sys; data=json.load(sys.stdin); assert all(set(item)=={"metainfo"} for item in data["nftables"])'
          # No interfaces, uplink, listeners or traffic are created. Only this
          # disposable namespace receives policies; host rules are untouched.
          mkdir -p "$RUNNER_TEMP/m7-policy-export"
          for phase in calibration restricted peer; do
            sudo ip netns exec "$namespace" nft flush ruleset
            sudo ip netns exec "$namespace" nft --json --file "infra/m7-staging/synthetic-${phase}.nft.json"
            sudo ip netns exec "$namespace" nft --json --handle list ruleset > "$RUNNER_TEMP/m7-policy-export/$phase.json"
          done
          python3 - "$RUNNER_TEMP/m7-policy-export" <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, "workers/scripts")
          from oms_synthetic_contract import counter_values, policy, policy_shape, snapshot_identity
          mismatches = []
          for phase in ("calibration", "restricted", "peer"):
              actual = json.loads((Path(sys.argv[1]) / f"{phase}.json").read_text())
              assert len(counter_values(actual)) == 14
              assert all(value == (0, 0) for value in counter_values(actual).values())
              snapshot_identity(actual)
              if policy_shape(actual) != policy_shape(policy(phase)):
                  print(f"M7_EXPORT_{phase}=" + json.dumps(actual, separators=(",", ":")))
                  mismatches.append(phase)
              else:
                  print(f"M7_ROUND_TRIP_PASSED: {phase}; 14 zero counters; handles present")
          assert not mismatches, f"NFT_EXPORT_MISMATCH: {mismatches}"
          PY

name: Automated Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

permissions:
  contents: read

concurrency:
  group: automated-release-master
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.repository == 'Gopi-git-bit/New-logistic-'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout CI-tested commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup release runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.3'

      - name: Install locked release tooling
        run: npm ci --prefix tools/release --ignore-scripts --no-audit --no-fund

      - name: Test release configuration
        run: npm test --prefix tools/release

      - name: Release only the current CI-tested master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          current_sha=$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            ls-remote --exit-code origin refs/heads/master | cut -f1)
          if [ "$current_sha" != "$EXPECTED_SHA" ]; then
            echo "Skipping stale CI completion: master has advanced."
            exit 0
          fi
          node tools/release/node_modules/semantic-release/bin/semantic-release.js \
            --extends ./release.config.cjs

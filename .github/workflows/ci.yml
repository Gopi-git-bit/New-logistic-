name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  compose-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: cp .env.example .env
      - run: docker compose config
      - name: Validate API delivery preparation
        shell: bash
        run: |
          set -euo pipefail
          task_dir="$(mktemp -d "$RUNNER_TEMP/zippy-api-contract.XXXXXX")"
          trap 'rm -rf -- "$task_dir"' EXIT
          python3 -I scripts/prepare_api_build_context.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --source-sha "$(git rev-parse HEAD)" \
            --output "$task_dir/context" > "$task_dir/context-manifest.json"
          cat "$task_dir/context-manifest.json"
          python3 -I scripts/validate_api_staging_config.py \
            --repo-root "$task_dir/context" \
            --manifest "$GITHUB_WORKSPACE/infra/staging/api-validation.compose.json"
          docker compose --env-file /dev/null -f infra/staging/api-validation.compose.json \
            --profile validation-only config --quiet

  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
        working-directory: workers
      - name: Run worker regressions
        run: python -m pytest tests -q
        working-directory: workers
      - name: Prove provider denial offline
        run: python -m pytest -c pyproject.toml ../tests/test_external_apis.py -q
        working-directory: workers
      - run: ruff check src tests
        working-directory: workers
      - run: ruff format src tests
        working-directory: workers

  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements-api-dev.lock
      - name: Check delivery tools
        run: |
          python -m ruff check --config workers/pyproject.toml scripts/prepare_api_build_context.py scripts/validate_api_staging_config.py
          python -m ruff format --check --config workers/pyproject.toml scripts/prepare_api_build_context.py scripts/validate_api_staging_config.py
          python -m mypy --strict scripts/prepare_api_build_context.py scripts/validate_api_staging_config.py
      - name: Run API security tests
        env:
          DATABASE_URL: postgresql://localhost/test
          SUPABASE_URL: http://localhost
          SUPABASE_SERVICE_ROLE_KEY: test-key
          SUPABASE_JWT_SECRET: test-secret
          POSTGRES_PASSWORD: test-pass
          RAZORPAY_KEY_ID: rzp_test
          RAZORPAY_KEY_SECRET: test
          RAZORPAY_WEBHOOK_SECRET: whsec
          PAPERCLIP_URL: http://localhost
          PAPERCLIP_API_KEY: test
          HERMES_API_URL: http://localhost
          HERMES_API_KEY: test
        run: python -m pytest api/tests api/tests_m4 api/tests_m5 -v

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1

  secret-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for hardcoded secrets
        run: |
          echo "Checking for hardcoded secrets..."
          FOUND=$(find . -path ./.github -prune -o \( -name "*.py" -o -name "*.ts" \) -print0 | xargs -0 grep -rn "sk_live_" 2>/dev/null || true)
          if [ -n "$FOUND" ]; then
            echo "ERROR: Found hardcoded API keys:"
            echo "$FOUND"
            exit 1
          fi
          echo "Secret safety check passed"

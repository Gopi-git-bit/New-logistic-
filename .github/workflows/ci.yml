name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config

  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
        working-directory: workers
      - run: ruff check src tests
        working-directory: workers
      - run: ruff format src tests
        working-directory: workers

  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fastapi pydantic pydantic-settings httpx pytest pyjwt
      - name: Run API security tests
        env:
          DATABASE_URL: postgresql://localhost/test
          SUPABASE_URL: http://localhost
          SUPABASE_SERVICE_ROLE_KEY: test-key
          SUPABASE_JWT_SECRET: test-secret
          POSTGRES_PASSWORD: test-pass
          RAZORPAY_KEY_ID: rzp_test
          RAZORPAY_KEY_SECRET: test
          RAZORPAY_WEBHOOK_SECRET: whsec
          ODOO_URL: http://localhost
          ODOO_API_KEY: test
          PAPERCLIP_URL: http://localhost
          PAPERCLIP_API_KEY: test
          HERMES_API_URL: http://localhost
          HERMES_API_KEY: test
        run: python -m pytest api/tests/ -v

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1

  secret-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for hardcoded secrets
        run: |
          echo "Checking for hardcoded secrets..."
          FOUND=$(find . -path ./.github -prune -o \( -name "*.py" -o -name "*.ts" \) -print0 | xargs -0 grep -rn "sk_live_" 2>/dev/null || true)
          if [ -n "$FOUND" ]; then
            echo "ERROR: Found hardcoded API keys:"
            echo "$FOUND"
            exit 1
          fi
          echo "Secret safety check passed"

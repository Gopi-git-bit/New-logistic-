name: Validate provider secret presence

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Provider secret to check (presence only)
        required: true
        default: deepseek
        type: choice
        options:
          - deepseek
          - openrouter

permissions: {}

jobs:
  presence:
    name: Check selected secret availability
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    environment: Production
    steps:
      - name: Validate selection
        shell: bash
        env:
          PROVIDER: ${{ inputs.provider }}
        run: |
          set -euo pipefail
          case "$PROVIDER" in
            deepseek|openrouter) ;;
            *) echo 'Unsupported provider selection.'; exit 1 ;;
          esac

      - name: Check DeepSeek secret presence
        if: ${{ inputs.provider == 'deepseek' }}
        shell: bash
        env:
          PROVIDER_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${PROVIDER_KEY:-}" ]]; then
            echo 'DEEPSEEK_API_KEY is unavailable to this job.'
            exit 1
          fi
          echo 'DEEPSEEK_API_KEY is present. Validity, staging scope and M7 readiness remain unverified.'

      - name: Check OpenRouter secret presence
        if: ${{ inputs.provider == 'openrouter' }}
        shell: bash
        env:
          PROVIDER_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${PROVIDER_KEY:-}" ]]; then
            echo 'OPENROUTER_API_KEY is unavailable to this job.'
            exit 1
          fi
          echo 'OPENROUTER_API_KEY is present. Validity, staging scope and Qwen fallback readiness remain unverified.'

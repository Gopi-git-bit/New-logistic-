name: zippy-production

x-common: &common
  restart: unless-stopped
  env_file:
    - /etc/zippy/.env
  networks:
    - backend

services:
  zippy-db:
    <<: *common
    build:
      context: ./infra/docker
      dockerfile: Dockerfile.db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-zippy}
    volumes:
      - zippy_postgres_data:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-zippy}"]
      interval: 10s
      timeout: 5s
      retries: 10

  odoo-db:
    <<: *common
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${ODOO_DB_USER}
      POSTGRES_PASSWORD: ${ODOO_DB_PASSWORD}
      POSTGRES_DB: ${ODOO_DB:-odoo18}
    volumes:
      - odoo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ODOO_DB_USER} -d ${ODOO_DB:-odoo18}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    <<: *common
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - zippy_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  odoo:
    <<: *common
    image: odoo:18.0
    environment:
      HOST: odoo-db
      PORT: 5432
      USER: ${ODOO_DB_USER}
      PASSWORD: ${ODOO_DB_PASSWORD}
    volumes:
      - zippy_odoo_data:/var/lib/odoo
      - ./infra/odoo/addons:/mnt/extra-addons:ro
      - ./infra/odoo/config:/etc/odoo:ro
    depends_on:
      odoo-db:
        condition: service_healthy

  api:
    <<: *common
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      ODOO_URL: http://odoo:8069
      ODOO_DB: ${ODOO_DB:-odoo18}
      ODOO_USER: ${ODOO_USER}
      ODOO_API_KEY: ${ODOO_API_KEY}
      PAPERCLIP_URL: ${PAPERCLIP_URL}
      PAPERCLIP_API_KEY: ${PAPERCLIP_API_KEY}
      HERMES_API_URL: ${HERMES_API_URL}
      HERMES_API_KEY: ${HERMES_API_KEY}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      COMPOSIO_API_KEY: ${COMPOSIO_API_KEY}
      COMPOSIO_MCP_URL: ${COMPOSIO_MCP_URL}
      TINYFISH_API_KEY: ${TINYFISH_API_KEY}
      TINYFISH_API_URL: ${TINYFISH_API_URL:-}
      TINYFISH_TOOL_NAME: ${TINYFISH_TOOL_NAME:-tinyfish.start_task}
      APP_BASE_URL: ${APP_BASE_URL}
      API_BASE_URL: ${API_BASE_URL}
    depends_on:
      zippy-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      odoo:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10

  workers:
    <<: *common
    build:
      context: ./workers
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      PAPERCLIP_URL: ${PAPERCLIP_URL}
      PAPERCLIP_API_KEY: ${PAPERCLIP_API_KEY}
      HERMES_API_URL: ${HERMES_API_URL}
      HERMES_API_KEY: ${HERMES_API_KEY}
      COMPOSIO_API_KEY: ${COMPOSIO_API_KEY}
      COMPOSIO_MCP_URL: ${COMPOSIO_MCP_URL}
      TINYFISH_API_KEY: ${TINYFISH_API_KEY}
      TINYFISH_API_URL: ${TINYFISH_API_URL:-}
      TINYFISH_TOOL_NAME: ${TINYFISH_TOOL_NAME:-tinyfish.start_task}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      ODOO_URL: http://odoo:8069
      ODOO_DB: ${ODOO_DB:-odoo18}
      ODOO_USER: ${ODOO_USER}
      ODOO_API_KEY: ${ODOO_API_KEY}
    depends_on:
      zippy-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    <<: *common
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  zippy_postgres_data:
  odoo_postgres_data:
  zippy_redis_data:
  zippy_odoo_data:

networks:
  backend:
    driver: bridge
    internal: false
